<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galleria studenti LUDiCa</title>

  <!-- FONT GOOGLE: per cambiare font modifica i nomi qui e in --font-testo / --font-titolo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* =====================================================================
       GUIDA ALLA PERSONALIZZAZIONE
       Modifica SOLO i valori qui sotto, nel blocco ":root". Il resto del
       codice si adatta da solo. Dopo ogni modifica salva e ricarica la pagina.

       FOTO
       --dimensione-foto    larghezza di ogni foto (es. 300px, 440px, 560px).
                            Piu' e' grande, meno colonne entrano per riga.
       --formato-foto       forma dello spazio foto: 1 / 1 (quadrato),
                            4 / 5 (verticale), 3 / 4 (ritratto), 4 / 3 (largo).
       --adattamento-foto   contain = foto intera, senza tagli (puo' lasciare bordi)
                            cover   = riempie tutto lo spazio (puo' tagliare i lati)
       --raggio-foto        angoli arrotondati: 0px = squadrati, 50% = cerchio
                            (con formato 1 / 1).
       --ombra-foto         ombra sotto la foto: usa "none" per toglierla.

       TESTO
       --font-testo / --font-titolo   famiglie di caratteri (vedi sotto per i font
                            Google). Scrivi sempre un font di riserva alla fine.
       --dim-titolo         dimensione del nome   (es. 20px, 24px, 28px)
       --dim-attivita       dimensione dell'attivita' (es. 15px, 17px)
       --dim-universita     dimensione dell'universita'
       --peso-titolo        400 normale, 600 semi-grassetto, 700/800 grassetto
       --colore-...         colori in formato #rrggbb

       LAYOUT
       --spazio-colonne / --spazio-righe   distanza tra le schede
       --padding-scheda     spazio interno attorno a foto e testo
       --larghezza-massima  larghezza massima della galleria

       CAMBIARE FONT (Google Fonts)
       1. Vai su fonts.google.com e scegli un font (es. "Lora").
       2. Sostituisci il nome nel tag <link> qui sopra, nella <head>
          (family=Lora:wght@400;700).
       3. Scrivi lo stesso nome in --font-titolo e/o --font-testo.
       Se non vuoi font esterni, usa solo: Arial, Georgia, "Trebuchet MS", Verdana.
       ===================================================================== */

    :root {
      /* ---- FOTO ---- */
      --dimensione-foto: 440px;
      --formato-foto: 1 / 1;
      --adattamento-foto: contain;
      --raggio-foto: 12px;
      --ombra-foto: 0 8px 24px rgba(20, 30, 50, 0.14);
      --sfondo-foto: #eef1f5;

      /* ---- FONT E DIMENSIONI DEL TESTO ---- */
      --font-testo: "Source Sans 3", Arial, Helvetica, sans-serif;
      --font-titolo: "Fraunces", Georgia, "Times New Roman", serif;
      --dim-titolo: 26px;
      --peso-titolo: 600;
      --dim-attivita: 17px;
      --dim-universita: 15px;
      --dim-ricerca: 17px;

      /* ---- COLORI ---- */
      --sfondo: #ffffff;
      --colore-titolo: #14213d;
      --colore-attivita: #3b4558;
      --colore-universita: #6a7487;
      --accento: #1f5fbf;
      --bordo: #dfe4ec;
      --sfondo-scheda: #ffffff;

      /* ---- LAYOUT ---- */
      --larghezza-massima: 1500px;
      --spazio-colonne: 32px;
      --spazio-righe: 36px;
      --padding-scheda: 20px;
      --raggio-scheda: 16px;
    }

    /* ===== da qui in poi non serve modificare nulla ===== */

    * { box-sizing: border-box; }

    /* Nessuna barra di scorrimento: l'altezza viene comunicata alla pagina
       WordPress tramite postMessage (vedi funzione reportHeight). */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow: hidden;
      background: var(--sfondo);
      color: var(--colore-titolo);
      font-family: var(--font-testo);
      scrollbar-width: none;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

    .gallery-shell {
      width: 100%;
      max-width: var(--larghezza-massima);
      margin: 0 auto;
      padding: 32px 28px 40px;
      overflow: hidden;
    }

    /* Ricerca */
    .search-area { max-width: 640px; margin: 0 auto 44px; }

    .search-label {
      display: block;
      margin-bottom: 10px;
      font-size: calc(var(--dim-ricerca) - 1px);
      font-weight: 600;
      color: var(--colore-attivita);
    }

    .search-input {
      display: block;
      width: 100%;
      min-height: 54px;
      padding: 12px 20px;
      border: 1.5px solid var(--bordo);
      border-radius: 999px;
      background: #f7f9fc;
      color: var(--colore-titolo);
      font: inherit;
      font-size: var(--dim-ricerca);
      transition: border-color .15s, background-color .15s, box-shadow .15s;
    }
    .search-input::placeholder { color: #8a93a4; }
    .search-input:disabled { opacity: .6; }
    .search-input:focus {
      outline: none;
      border-color: var(--accento);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(31, 95, 191, 0.16);
    }

    .search-status {
      min-height: 20px;
      margin: 10px 20px 0;
      color: var(--colore-universita);
      font-size: 14px;
    }

    /* Griglia */
    .gallery {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(min(100%, calc(var(--dimensione-foto) + 2 * var(--padding-scheda))), 1fr)
      );
      gap: var(--spazio-righe) var(--spazio-colonne);
    }

    .card {
      min-width: 0;
      padding: var(--padding-scheda);
      border: 1px solid var(--bordo);
      border-radius: var(--raggio-scheda);
      background: var(--sfondo-scheda);
      text-align: center;
      overflow-wrap: anywhere;
    }

    .card-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      color: inherit;
      text-decoration: none;
    }

    a.card-content:focus-visible {
      outline: 3px solid var(--accento);
      outline-offset: 6px;
      border-radius: 8px;
    }

    .photo-box {
      display: grid;
      place-items: center;
      width: 100%;
      max-width: var(--dimensione-foto);
      aspect-ratio: var(--formato-foto);
      margin: 0 auto 20px;
      border-radius: var(--raggio-foto);
      background: var(--sfondo-foto);
      box-shadow: var(--ombra-foto);
      overflow: hidden;
    }

    .student-photo {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: var(--adattamento-foto);
      transition: transform .35s ease;
    }
    a.card-content:hover .student-photo { transform: scale(1.04); }

    .photo-placeholder {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      background: #e3e8f0;
      color: #5a6a85;
      font-family: var(--font-titolo);
      font-size: clamp(32px, 8vw, 72px);
      font-weight: 600;
    }

    .card-title {
      margin: 0 0 8px;
      font-family: var(--font-titolo);
      font-size: var(--dim-titolo);
      font-weight: var(--peso-titolo);
      line-height: 1.2;
      color: var(--colore-titolo);
      transition: color .15s;
    }
    a.card-content:hover .card-title { color: var(--accento); }

    .card-activity,
    .card-university {
      margin: 0;
      line-height: 1.5;
      white-space: pre-line;
    }
    .card-activity { font-size: var(--dim-attivita); color: var(--colore-attivita); }
    .card-university {
      margin-top: 6px;
      font-size: var(--dim-universita);
      color: var(--colore-universita);
    }

    .message {
      max-width: 760px;
      margin: 20px auto;
      padding: 18px 22px;
      border: 1px solid var(--bordo);
      border-radius: 12px;
      background: #f7f9fc;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    [hidden] { display: none !important; }

    @media (max-width: 760px) {
      :root { --spazio-colonne: 18px; --spazio-righe: 24px; --padding-scheda: 14px; }
      .gallery-shell { padding: 24px 16px 32px; }
    }
    @media (max-width: 480px) {
      .gallery-shell { padding: 20px 12px 28px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      a.card-content:hover .student-photo { transform: none; }
    }
  </style>
  
</head>

<body>
  <main id="gallery-shell" class="gallery-shell">
    <div class="search-area">
      <label class="search-label" for="gallery-search">
        Cerca nella galleria
      </label>

      <input
        id="gallery-search"
        class="search-input"
        type="search"
        placeholder="Cerca per nome, cognome, attività o università…"
        autocomplete="off"
        disabled
      >

      <p
        id="search-status"
        class="search-status"
        aria-live="polite"
      ></p>
    </div>

    <div id="message" class="message" role="status">
      Caricamento della galleria…
    </div>

    <section
      id="gallery"
      class="gallery"
      aria-label="Studenti LUDiCa"
      aria-busy="true"
    ></section>
  </main>

  <script>
    /*
      FOGLIO GOOGLE PUBBLICATO COME CSV

      Colonne:
      Nome | Cognome | attività | Università | Url immagine

      Colonna facoltativa:
      LINK
    */
    const CSV_URL =
      'https://docs.google.com/spreadsheets/d/e/2PACX-1vS34F0w8wxRcuKCdA6U47ZME5g8MER3REtlrlt5arjiPB79oEepkWAFECBd2NbFfKPzEHlmMxkoLGWS/pub?gid=172330443&single=true&output=csv';

    const shell = document.getElementById('gallery-shell');
    const gallery = document.getElementById('gallery');
    const message = document.getElementById('message');
    const searchInput = document.getElementById('gallery-search');
    const searchStatus = document.getElementById('search-status');

    let allItems = [];
    let heightFrame = 0;
    let lastHeight = 0;

    /*
      Comunica a WordPress l'altezza reale del contenuto.
      Richiede il listener nel codice di incorporamento.
    */
    function reportHeight() {
      if (heightFrame) return;

      heightFrame = requestAnimationFrame(function () {
        heightFrame = 0;

        const height = Math.ceil(
          shell.getBoundingClientRect().height
        ) + 2;

        if (height === lastHeight) return;
        lastHeight = height;

        if (window.parent !== window) {
          window.parent.postMessage(
            {
              type: 'gallery-height',
              height: height
            },
            '*'
          );
        }
      });
    }

    function showMessage(text) {
      message.textContent = text;
      message.hidden = false;
      reportHeight();
    }

    function normalizeHeader(value) {
      return String(value || '')
        .replace(/^\uFEFF/, '')
        .trim()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, ' ')
        .toUpperCase();
    }

    function searchableText(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLocaleLowerCase('it');
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = '';
      let quoted = false;

      text = text.replace(/^\uFEFF/, '');

      for (let index = 0; index < text.length; index++) {
        const character = text[index];

        if (quoted) {
          if (character === '"' && text[index + 1] === '"') {
            value += '"';
            index++;
          } else if (character === '"') {
            quoted = false;
          } else {
            value += character;
          }
        } else if (character === '"') {
          quoted = true;
        } else if (character === ',') {
          row.push(value.trim());
          value = '';
        } else if (character === '\n' || character === '\r') {
          if (character === '\r' && text[index + 1] === '\n') {
            index++;
          }

          row.push(value.trim());
          rows.push(row);
          row = [];
          value = '';
        } else {
          value += character;
        }
      }

      if (quoted) {
        throw new Error('Il CSV contiene virgolette non chiuse.');
      }

      if (value || row.length) {
        row.push(value.trim());
        rows.push(row);
      }

      return rows.filter(function (cells) {
        return cells.some(function (cell) {
          return cell !== '';
        });
      });
    }

    function itemsFromCsv(text) {
      const rows = parseCsv(text);
      if (!rows.length) return [];

      const headers = rows.shift().map(normalizeHeader);

      const required = [
        'NOME',
        'COGNOME',
        'ATTIVITA',
        'UNIVERSITA',
        'URL IMMAGINE'
      ];

      const missing = required.filter(function (name) {
        return !headers.includes(name);
      });

      if (missing.length) {
        throw new Error(
          'Colonne mancanti nel foglio: ' + missing.join(', ') + '.'
        );
      }

      return rows.map(function (row) {
        return Object.fromEntries(
          headers.map(function (header, index) {
            return [header, row[index] || ''];
          })
        );
      }).filter(function (item) {
        return item.NOME || item.COGNOME;
      });
    }

    function safeHttpUrl(value) {
      const text = String(value || '').trim();
      if (!text) return '';

      try {
        const url = new URL(text);

        return ['http:', 'https:'].includes(url.protocol)
          ? url.href
          : '';
      } catch (error) {
        return '';
      }
    }

    function createPlaceholder(item) {
      const placeholder = document.createElement('div');
      placeholder.className = 'photo-placeholder';
      placeholder.setAttribute('aria-hidden', 'true');

      placeholder.textContent = [item.NOME, item.COGNOME]
        .filter(Boolean)
        .map(function (part) {
          return Array.from(part.trim())[0] || '';
        })
        .join('')
        .toLocaleUpperCase('it');

      return placeholder;
    }

    function createCard(item) {
      const fullName = [item.NOME, item.COGNOME]
        .filter(Boolean)
        .join(' ');

      const article = document.createElement('article');
      article.className = 'card';

      const destination = safeHttpUrl(item.LINK);
      const content = document.createElement(
        destination ? 'a' : 'div'
      );

      content.className = 'card-content';

      if (destination) {
        content.href = destination;
        content.target = '_blank';
        content.rel = 'noopener noreferrer';
      }

      const photoBox = document.createElement('div');
      photoBox.className = 'photo-box';

      const photoUrl = safeHttpUrl(item['URL IMMAGINE']);

      if (photoUrl) {
        const image = document.createElement('img');
        image.className = 'student-photo';
        image.src = photoUrl;
        image.alt = '';
        image.loading = 'lazy';
        image.decoding = 'async';
        image.referrerPolicy = 'no-referrer';

        image.addEventListener('load', reportHeight);

        image.addEventListener('error', function () {
          photoBox.replaceChildren(createPlaceholder(item));
          reportHeight();
        });

        photoBox.appendChild(image);
      } else {
        photoBox.appendChild(createPlaceholder(item));
      }

      const title = document.createElement('h2');
      title.className = 'card-title';
      title.textContent = fullName;

      content.append(photoBox, title);

      if (item.ATTIVITA) {
        const activity = document.createElement('p');
        activity.className = 'card-activity';
        activity.textContent = item.ATTIVITA;
        content.appendChild(activity);
      }

      if (item.UNIVERSITA) {
        const university = document.createElement('p');
        university.className = 'card-university';
        university.textContent = item.UNIVERSITA;
        content.appendChild(university);
      }

      article.appendChild(content);
      return article;
    }

    function renderItems(items, filtered) {
      const fragment = document.createDocumentFragment();

      items.forEach(function (item) {
        fragment.appendChild(createCard(item));
      });

      gallery.replaceChildren(fragment);
      message.hidden = true;

      searchStatus.textContent = filtered
        ? items.length + (
            items.length === 1
              ? ' risultato trovato'
              : ' risultati trovati'
          )
        : '';

      if (!items.length) {
        showMessage(
          filtered
            ? 'Nessuno studente corrisponde alla ricerca.'
            : 'Il foglio non contiene ancora studenti da mostrare.'
        );
      }

      reportHeight();
    }

    function filterGallery() {
      const query = searchableText(searchInput.value.trim());
      const terms = query.split(/\s+/).filter(Boolean);

      if (!terms.length) {
        renderItems(allItems, false);
        return;
      }

      const filtered = allItems.filter(function (item) {
        const text = searchableText(
          [
            item.NOME,
            item.COGNOME,
            item.ATTIVITA,
            item.UNIVERSITA
          ].join(' ')
        );

        return terms.every(function (term) {
          return text.includes(term);
        });
      });

      renderItems(filtered, true);
    }

    async function loadGallery() {
      const controller = new AbortController();

      const timeout = setTimeout(function () {
        controller.abort();
      }, 25000);

      try {
        const response = await fetch(CSV_URL, {
          cache: 'no-store',
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error('Errore HTTP ' + response.status + '.');
        }

        const text = await response.text();

        if (/^\s*</.test(text)) {
          throw new Error(
            'Il collegamento restituisce una pagina HTML invece del CSV.'
          );
        }

        allItems = itemsFromCsv(text);
        renderItems(allItems, false);
        searchInput.disabled = false;
      } catch (error) {
        console.error(error);

        const detail = error.name === 'AbortError'
          ? 'Il foglio Google non ha risposto in tempo.'
          : error.message;

        showMessage(
          'Impossibile caricare i dati. ' +
          detail +
          ' Verifica che il foglio sia pubblicato sul web come CSV.'
        );
      } finally {
        clearTimeout(timeout);
        gallery.setAttribute('aria-busy', 'false');
        reportHeight();
      }
    }

    searchInput.addEventListener('input', filterGallery);
    window.addEventListener('load', reportHeight);
    window.addEventListener('resize', reportHeight);

    if ('ResizeObserver' in window) {
      const observer = new ResizeObserver(reportHeight);
      observer.observe(shell);
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(reportHeight);
    }

    loadGallery();
  </script>
</body>
</html>
